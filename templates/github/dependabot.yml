version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, security]
    ignore:
      # gh-aw generates and owns action pins inside compiled *.lock.yml workflows.
      # Upgrade gh-aw and recompile instead of letting Dependabot edit generated locks.
      - dependency-name: "github/gh-aw-actions/*"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/mobile
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
