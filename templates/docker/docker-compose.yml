version: '3.9'

# Replace {project} with your project name (e.g. invoiceflow, legalaid)
# Replace {PROJECT} with UPPERCASE version for env vars

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: {project}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: {project}
      POSTGRES_USER: {project}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {project} -d {project}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {project}-net

  # ── Redis Cache ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: {project}-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - {project}-net

  # ── smtp4dev (local email capture) ────────────────────────────────────────────
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: {project}-smtp4dev
    restart: unless-stopped
    ports:
      - "5050:80"   # Web UI
      - "2525:25"   # SMTP
    networks:
      - {project}-net

  # ── .NET 8 API Backend ───────────────────────────────────────────────────────
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: {project}-api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database={project};Username={project};Password=${DB_PASSWORD:-ChangeMe123!}"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5075
      Jwt__Key: ${JWT_KEY:-super-secret-jwt-key-min-32-chars!!}
      Jwt__Issuer: {project}-api
      Jwt__Audience: {project}-app
      Resend__ApiKey: ${RESEND_API_KEY:-re_placeholder}
      Resend__From: "{Project} <noreply@yourdomain.com>"
      Smtp__Host: smtp4dev
      Smtp__Port: "25"
    ports:
      - "5075:5075"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - {project}-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5075/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── React Frontend (Nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5075
    container_name: {project}-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - {project}-net

volumes:
  postgres_data:
    driver: local

networks:
  {project}-net:
    driver: bridge
