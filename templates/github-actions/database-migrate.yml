name: Apply Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment. Production must have required reviewers configured.
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend
    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Require environment-scoped database credential
        run: test -n "${ConnectionStrings__DefaultConnection:-}"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Show pending migration context
        run: >-
          dotnet ef migrations list
          --project {Project}.Infrastructure/{Project}.Infrastructure.csproj
          --startup-project {Project}.API/{Project}.API.csproj
          --no-build

      - name: Apply migrations
        run: >-
          dotnet ef database update
          --project {Project}.Infrastructure/{Project}.Infrastructure.csproj
          --startup-project {Project}.API/{Project}.API.csproj
          --no-build
