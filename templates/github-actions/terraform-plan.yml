# Terraform fmt + plan on infra changes (no apply).
#
# Optional secrets for remote state / AWS:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION

name: Terraform plan

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-plan.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -f backend.tf ]; then
            terraform init -input=false
          else
            echo "No backend.tf — init without backend"
            terraform init -backend=false -input=false
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "Skipping plan — AWS credentials not set"
            exit 0
          fi
          if [ ! -f terraform.tfvars ]; then
            echo "No terraform.tfvars in CI (expected). Skipping plan."
            exit 0
          fi
          terraform plan -input=false -no-color
