# Deploy React (Vite) frontend to S3 + CloudFront
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   FRONTEND_S3_BUCKET              from: terraform output frontend_bucket
#   CLOUDFRONT_DISTRIBUTION_ID      from: terraform output cloudfront_id
#   VITE_API_URL                    from: terraform output api_url

name: Deploy frontend to S3 and CloudFront

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/deploy-frontend-s3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Require VITE_API_URL
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL secret is not set."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static assets (long cache)
        run: >-
          aws s3 sync dist/
          "s3://${{ secrets.FRONTEND_S3_BUCKET }}/"
          --delete
          --cache-control "public,max-age=31536000,immutable"
          --exclude "index.html"

      - name: Upload index.html (no cache)
        run: >-
          aws s3 cp dist/index.html
          "s3://${{ secrets.FRONTEND_S3_BUCKET }}/index.html"
          --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
