# Build and submit Android app via EAS
#
# Required GitHub secrets:
#   EXPO_TOKEN    from: expo.dev → Account Settings → Access Tokens

name: Mobile Android Build and Submit

on:
  push:
    branches: [main]
    paths:
      - 'src/mobile/**'
      - '.github/workflows/mobile-android-build.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options: [development, preview, production]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: src/mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (Android)
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive

      - name: Submit to Play Store (production only)
        if: ${{ (github.event.inputs.profile || 'production') == 'production' }}
        run: eas submit --platform android --latest --non-interactive
