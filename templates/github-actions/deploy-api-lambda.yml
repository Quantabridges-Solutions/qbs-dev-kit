# Deploy .NET API to AWS Lambda using GitHub OIDC.
#
# Required GitHub environment/repository variables:
#   AWS_DEPLOY_ROLE_ARN            IAM role trusted by GitHub OIDC
#   AWS_REGION                     e.g. eu-west-1
#   LAMBDA_FUNCTION_NAME           from: terraform output lambda_function_name
#
# Database migrations are intentionally NOT performed here. Use the separate
# database-migrate workflow behind an environment approval gate.

name: Deploy API to AWS Lambda

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/deploy-api-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Publish for Lambda (linux-x64)
        run: >-
          dotnet publish {Project}.API/{Project}.API.csproj
          -c Release
          -r linux-x64
          --self-contained false
          --no-restore
          -o "${{ runner.temp }}/lambda-publish"

      - name: Zip bundle
        run: cd "${{ runner.temp }}/lambda-publish" && zip -qr "${{ runner.temp }}/lambda.zip" .

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: qbs-${{ github.run_id }}

      - name: Update Lambda function code
        run: >-
          aws lambda update-function-code
          --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"
          --zip-file "fileb://${{ runner.temp }}/lambda.zip"

      - name: Wait until function is active
        run: >-
          aws lambda wait function-updated-v2
          --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      - name: Verify deployed function metadata
        run: >-
          aws lambda get-function-configuration
          --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"
          --query '{State:State,LastUpdateStatus:LastUpdateStatus,Version:Version}'
