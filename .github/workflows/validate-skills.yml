name: Validate skills

on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.sh'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.sh'
      - '.github/workflows/validate-skills.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        run: bash scripts/validate-skills.sh
